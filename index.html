<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="See which Amsterdam Dance Event parties are on near you right now. Unofficial; not affiliated with ADE." />
    <title>Unofficial ADE map</title>
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <header class="bar">
      <h1 class="bar__title">Unofficial ADE map</h1>
      <p class="bar__note">Not affiliated with ADE</p>
    </header>
    <main class="layout">
      <div id="map" class="map" role="region" aria-label="Map of events"></div>
      <section id="panel" class="panel" aria-label="Pick a time"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
